# nginx server block for wiki.pastlives.space (Hetzner VPS)
# Reference copy — the live file is /etc/nginx/sites-available/wiki.pastlives.space.
# Apply changes manually, then: nginx -t && systemctl reload nginx
server {
    server_name wiki.pastlives.space;
    root /var/www/wiki.pastlives.space/public;
    index index.php index.html;

    access_log /var/log/nginx/wiki.pastlives.space-access.log;
    error_log /var/log/nginx/wiki.pastlives.space-error.log;

    include /etc/nginx/snippets/security-headers.conf;

    client_max_body_size 64M;

    # MediaWiki short URLs
    location / {
        try_files $uri $uri/ @mediawiki;
    }

    location @mediawiki {
        rewrite ^/(.*)$ /index.php?title=$1&$args last;
    }

    # PHP handling
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/wiki.pastlives.space.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Block dotfiles
    location ~ /\. {
        deny all;
    }

    # Deny access to sensitive MediaWiki directories
    location ~* ^/(cache|includes|maintenance|languages|serialized|tests|images/deleted)/ {
        deny all;
    }

    location ~* ^/(COPYING|CREDITS|FAQ|HISTORY|INSTALL|README|RELEASE-NOTES|UPGRADE)$ {
        deny all;
    }

    # Static file caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; allow all; }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/wiki.pastlives.space/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/wiki.pastlives.space/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = wiki.pastlives.space) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name wiki.pastlives.space;
    return 404; # managed by Certbot


}
